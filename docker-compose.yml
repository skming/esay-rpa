services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rpa
      POSTGRES_USER: rpa
      POSTGRES_PASSWORD: rpa
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpa -d rpa"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://rpa:rpa@postgres:5432/rpa
      RPA_FLOW_STORE_BACKEND: sqlalchemy
      RPA_TASK_STORE_BACKEND: sqlalchemy
      RPA_SCHEDULE_STORE_BACKEND: sqlalchemy
      RPA_TASK_QUEUE_BACKEND: redis
      RPA_REDIS_URL: redis://redis:6379/0
      RPA_TASK_QUEUE_NAME: rpa:tasks
      RPA_ARTIFACT_STORE_BACKEND: minio
      RPA_MINIO_ENDPOINT: minio:9000
      RPA_MINIO_ACCESS_KEY: minioadmin
      RPA_MINIO_SECRET_KEY: minioadmin
      RPA_MINIO_BUCKET: rpa-artifacts
      RPA_MINIO_SECURE: "false"
    ports:
      - "8765:8765"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
