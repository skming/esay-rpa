[project]
name = "easy-rpa-backend"
version = "0.1.0"
description = "FastAPI backend service for Easy RPA automation tasks."
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10.4",
  "croniter>=2.0.7",
  "fastapi>=0.115.0",
  "minio>=7.2.10",
  "pydantic>=2.8.0",
  "redis>=5.2.0",
  "scrapling[ai,fetchers]>=0.3.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "uvicorn[standard]>=0.30.0",
  "litellm>=1.89.2",
  "openpyxl>=3.1.0",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20.0",
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.9.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# 应用模块导入期即创建 logger，必须排在 _setup_file_logging 之后才吃得到日志配置
"app/main.py" = ["E402"]
