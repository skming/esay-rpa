[project]
name = "easy-rpa-backend"
version = "0.1.0"
description = "FastAPI backend service for Easy RPA automation tasks."
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.11.3",
  "croniter>=6.2.3",
  "fastapi>=0.139.0",
  "minio>=7.2.20",
  "pydantic>=2.13.4",
  "redis>=8.0.1",
  "scrapling[ai,fetchers]>=0.4.10",
  "sqlalchemy[asyncio]>=2.0.51",
  "asyncpg>=0.31.0",
  "uvicorn[standard]>=0.50.1",
  "litellm>=1.91.0",
  "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.22.1",
  "httpx>=0.28.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.15.22,<0.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# 应用模块导入期即创建 logger，必须排在 _setup_file_logging 之后才吃得到日志配置
"app/main.py" = ["E402"]
