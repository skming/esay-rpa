<!doctype html>
<meta charset="utf-8"><title>歧义 scope · 含已填写的表单</title>
<!-- 测试页，不是凭据：value 里是探测泄露检测用的哨兵串，观察结果里出现它即说明探测把
     表单控件的 value 交了出去。密码框与普通文本框各放一个，两个都不该出现在返回里。 -->
<body>
  <main>
    <form id="prefilled">
      <input id="account" name="account" value="PROBE-LEAK-CANARY-ACCOUNT">
      <input id="secret" name="secret" type="password" value="PROBE-LEAK-CANARY-SECRET">
      <button type="submit">提交</button>
    </form>
  </main>
</body>
