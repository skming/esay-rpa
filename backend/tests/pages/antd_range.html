<!doctype html>
<meta charset="utf-8"><title>两个 AntD RangePicker</title>
<body>
  <div class="search-area">
    <div class="ant-picker ant-picker-range" id="search-range">
      <input class="ant-picker-input" placeholder="开始日期"><input class="ant-picker-input" placeholder="结束日期">
    </div>
    <button class="ant-btn ant-btn-primary">查询</button>
  </div>
  <div class="ant-modal" id="edit-modal">
    <div class="ant-picker ant-picker-range" id="edit-range">
      <input class="ant-picker-input" placeholder="开始日期"><input class="ant-picker-input" placeholder="结束日期">
    </div>
    <button class="ant-btn ant-btn-primary">查询</button>
  </div>
</body>
