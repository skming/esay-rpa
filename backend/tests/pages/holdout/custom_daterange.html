<!doctype html>
<meta charset="utf-8"><title>自研日期区间控件</title>
<body>
  <div class="dr-field" id="range-box">
    <div class="x-field">
      <input class="dr-in" data-role="from" placeholder="开始日期 yyyy-MM-dd">
    </div>
    <span class="dr-sep">~</span>
    <div class="x-field">
      <input class="dr-in" data-role="to" placeholder="结束日期 yyyy-MM-dd">
    </div>
  </div>
  <button class="dr-go">检索</button>
</body>
