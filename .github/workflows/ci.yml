name: Easy RPA CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.31"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --python 3.12

      - name: Run backend tests
        working-directory: backend
        run: uv run pytest

      - name: Run backend benchmark smoke checks
        working-directory: backend
        run: |
          uv run python tools/selector_regression.py --json-output storage/bench/selector-regression.json
          uv run python tools/load_test.py --tasks 20 --create-concurrency 20 --worker-concurrency 4 --cron-samples 1 --runner-sleep-ms 20 --timeout-seconds 15 --json-output storage/bench/load-test-ci.json

  frontend:
    name: Frontend and Electron build
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.31"
          enable-cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend Python dependencies
        working-directory: backend
        run: uv sync --frozen --python 3.12

      - name: Build renderer
        run: pnpm build

      - name: Check Electron scripts
        run: |
          node --check electron/backendClient.cjs
          node --check electron/runtime.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/pickerService.cjs
          node --check electron/pickerPreload.cjs
          node --check tools/measure_electron_startup.cjs
          node --check tools/notarize-mac.cjs
          node --check tools/verify_release_env.cjs
          node --check electron-builder.config.cjs

      - name: Pack Electron app
        run: pnpm electron:pack

      - name: Measure macOS cold start
        run: node tools/measure_electron_startup.cjs --runs 5 --max-average-ms 3000 --output output/bench/electron-startup.json

  docker:
    name: Docker compose verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Static compose contract check
        run: node tools/verify_compose_config.cjs

      - name: Validate compose file
        run: docker compose config

      - name: Build backend image
        run: docker compose build backend

      - name: Start dependency stack
        run: docker compose up -d postgres redis minio backend

      - name: Wait for backend health
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8765/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1

      - name: Verify queue backend
        run: |
          curl -fsS http://127.0.0.1:8765/api/queue | tee queue.json
          grep -q '"backend":"redis"' queue.json

      - name: Shutdown compose stack
        if: always()
        run: docker compose down -v
