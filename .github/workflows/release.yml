name: Easy RPA Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  desktop:
    name: Desktop package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            # Use signed build only when Apple credentials are available (tagged releases).
            # Falls back to adhoc signing for manual dispatch without secrets.
            build_cmd: |
              if [ -n "$CSC_LINK" ]; then
                pnpm electron:dist:signed
              else
                pnpm electron:dist
              fi
            artifact: release-macos
          - os: windows-latest
            platform: win32
            build_cmd: pnpm electron:dist:win
            artifact: release-windows
          - os: ubuntu-latest
            platform: linux
            build_cmd: pnpm electron:dist:linux
            artifact: release-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.31"
          enable-cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend Python dependencies
        working-directory: backend
        run: uv sync --frozen --python 3.12

      # Linux: system libraries required by Playwright / Electron
      # libasound2 was renamed to libasound2t64 in Ubuntu 24.04
      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 \
            libgbm1 libasound2t64 libxrandr2 libxfixes3 libxdamage1

      - name: Verify release credentials
        if: matrix.platform != 'linux' && secrets.CSC_LINK != ''
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node tools/verify_release_env.cjs ${{ matrix.platform }}

      - name: Build desktop package
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ${{ matrix.build_cmd }}
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.exe
            release/**/*.AppImage
            release/**/*.blockmap
          if-no-files-found: error
          retention-days: 30

  # Collect all platform artifacts and attach to the GitHub release
  publish:
    name: Publish GitHub Release
    needs: desktop
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-all/**/*
          generate_release_notes: true
